#!/usr/bin/env python3
PACKAGE = "edge_detection_node"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("blur_ksize", int_t, 0, "Gaussian blur kernel size (odd >= 1)", 5, 1, 31)
gen.add("th1",        int_t, 0, "Canny threshold 1", 100, 0, 500)
gen.add("th2",        int_t, 0, "Canny threshold 2", 200, 0, 500)

exit(gen.generate(PACKAGE, "edge_detection_node", "Canny"))

